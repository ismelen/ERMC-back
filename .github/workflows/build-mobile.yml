name: Build and Deploy Mobile APK

on:
  push:
    branches:
      - master
    paths:
      - 'front/mobile/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get App Version
        id: app_version
        run: |
          VERSION=$(jq -r '.expo.version' front/mobile/app.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download .env and google-services.json from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}:~/inkomi/front/mobile/.env ./front/mobile/.env || true
          scp -i ~/.ssh/id_rsa ${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}:~/inkomi/front/mobile/google-services.json ./front/mobile/google-services.json || true

      - name: Install dependencies
        working-directory: ./front/mobile
        run: npm install

      - name: Expo Prebuild
        working-directory: ./front/mobile
        run: npx expo prebuild --platform android

      - name: Build Android APK
        working-directory: ./front/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK for upload
        run: |
          mkdir -p build-output
          cp front/mobile/android/app/build/outputs/apk/release/app-release.apk build-output/inkomi.apk

      - name: Ensure directories exist on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            mkdir -p ~/inkomi/back/api/resources

      - name: Copy APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          source: "build-output/inkomi.apk"
          target: "~/inkomi/back/api/resources"
          strip_components: 1

      - name: Update version file in resources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            VERSION_FILE=~/inkomi/back/api/resources/app-version.txt
            echo "${{ steps.app_version.outputs.version }}" > "$VERSION_FILE"
